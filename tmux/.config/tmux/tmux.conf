set -sa terminal-overrides ",xterm*:Tc"

set -g mouse on

# Color Pallete
set -g @dark_blue '#61afef'
set -g @blue '#56b6c2'
set -g @red '#e06c75'
set -g @green '#98c379' 
set -g @purple '#c678dd'
set -g @cyan '#56b6c2'
set -g @orange '#be5046' 
set -g @yellow '#e5c07b'
set -g @gray '#828997'
set -g @white '#abb2bf'
set -g @black '#2c323c'
set -g @deep_black '#222830'

set -g pane-active-border-style "fg=#{@purple}"

# Status bar
set -g status-position top
set -g status-style  "bg=default"

set -g status-left-length 40
set -g status-left "\
#[fg=#{?client_prefix,#{@red},#{@purple}}]\
#[bg=#{?client_prefix,#{@red},#{@purple}} fg=#{@deep_black}] \
#[bg=#{@deep_black} fg=#{?client_prefix,#{@red},#{@purple}}] #S \
#[fg=#{@deep_black} bg=default]  "

set -g window-status-format "\
#[fg=#{@yellow}]\
#[bg=#{@yellow} fg=#{@deep_black} bold]#I \
#[bg=#{@deep_black} fg=#{@yellow}] #W \
#[bg=default fg=#{@deep_black}]"
set -g window-status-current-format "\
#[fg=#{@green}]\
#[bg=#{@green} fg=#{@deep_black} bold]#I \
#[bg=#{@deep_black} fg=#{@green}] #W \
#{?window_zoomed_flag,#[fg=@green] ,}\
#[bg=default fg=#{@deep_black}]"
set -g window-status-separator "#[fg=#{@gray}]"

set -g status-right "\
#[fg=#{@dark_blue}]#[bg=#{@dark_blue} fg=#{@deep_black}] \
#[fg=#{@dark_blue} bg=#{@deep_black}] #{cpu} #[fg=#{@deep_black} bg=#{@dark_blue}]  \
#[bg=#{@deep_black} fg=#{@dark_blue}] #{mem} #[bg=#{@dark_blue} fg=#{@deep_black}]  \
#[fg=#{@dark_blue} bg=#{@deep_black}] #{disk -f} #[fg=#{@deep_black} bg=default]"

# Change base index to 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Change prefix
set -g prefix C-b # (default)

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

# Initialize TMUX plugin manager
run -b '~/.config/tmux/plugins/tpm/tpm'

# Bindings
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
