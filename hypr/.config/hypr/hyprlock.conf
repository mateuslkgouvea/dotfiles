general {
    hide_cursor = true
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = ~/Pictures/wallpapers/main.png
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.1000
    brightness = 0.8000
    vibrancy = 0.1800
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(cdd6f4ff)
    font_size = 92
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(a9b1d6dd)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.20
    dots_center = true
    outer_color = rgba(7aa2f7cc)
    inner_color = rgba(1a1b26cc)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##a9b1d6">Senha...</span>
    hide_input = false
    check_color = rgba(9ece6acc)
    fail_color = rgba(f7768ecc)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(e0af68cc)
    position = 0, -40
    halign = center
    valign = center
    rounding = 12
}

label {
    monitor =
    text = 
    color = rgba(7aa2f7ee)
    font_size = 28
    font_family = JetBrainsMono Nerd Font
    position = 0, 25
    halign = center
    valign = center
}
