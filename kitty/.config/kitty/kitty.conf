# =========================
# FONT
# =========================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.5

# =========================
# CURSOR
# =========================
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# =========================
# TOKYO NIGHT COLORS
# =========================

# Background / Foreground
background            #1a1b26
foreground            #c0caf5

# Selection
selection_background  #33467c
selection_foreground  #c0caf5

# Cursor
cursor                #c0caf5

# URL
url_color             #73daca

# =========================
# ANSI COLORS
# =========================

# Black
color0  #15161e
color8  #414868

# Red
color1  #f7768e
color9  #f7768e

# Green
color2  #9ece6a
color10 #9ece6a

# Yellow
color3  #e0af68
color11 #e0af68

# Blue
color4  #7aa2f7
color12 #7aa2f7

# Magenta
color5  #bb9af7
color13 #bb9af7

# Cyan
color6  #7dcfff
color14 #7dcfff

# White
color7  #a9b1d6
color15 #c0caf5

# =========================
# WINDOW / UI
# =========================

# Padding
window_padding_width 10

# Border
active_border_color   #7aa2f7
inactive_border_color #414868

# Tab bar
tab_bar_edge top
tab_bar_style powerline
active_tab_background   #7aa2f7
active_tab_foreground   #1a1b26
inactive_tab_background #1a1b26
inactive_tab_foreground #414868

# Transparency (opcional)
background_opacity 0.95

# Blur (Wayland/Compositor depende do Hyprland)
# Não é nativo do kitty, usa regra do compositor

# =========================
# SCROLLBACK
# =========================
scrollback_lines 10000

# =========================
# PERFORMANCE
# =========================
enable_audio_bell no
confirm_os_window_close 0

shell zsh
